name: Reproducible bug report
description: Report a local calculation, import, UI, or documentation problem with a safe minimal reproduction.
title: "bug: "
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the metric, import message, or interface behavior you observed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal steps to reproduce
      placeholder: "1. Run ...\n2. Load ...\n3. Set threshold ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: checkboxes
    id: data-safety
    attributes:
      label: Data safety
      options:
        - label: I did not include personal, high-impact, proprietary, secret, or unlicensed data.
          required: true
